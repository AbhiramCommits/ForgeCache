[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-coord",
    "crates/forge-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ForgeCache Contributors"]
repository = "https://github.com/example/forgecache"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
